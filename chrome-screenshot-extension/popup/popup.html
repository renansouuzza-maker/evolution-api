<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Screenshot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>📸 Page Capture</h1>
    <p class="subtitle">Captura seções e animações do site</p>

    <div class="settings">
      <label class="setting-item">
        <span>FPS para animações</span>
        <select id="fps">
          <option value="10">10 FPS</option>
          <option value="15">15 FPS</option>
          <option value="24" selected>24 FPS</option>
          <option value="30">30 FPS</option>
        </select>
      </label>
      <label class="setting-item">
        <span>Qualidade da imagem</span>
        <select id="quality">
          <option value="0.7">Média</option>
          <option value="0.85" selected>Alta</option>
          <option value="1.0">Máxima</option>
        </select>
      </label>
    </div>

    <button id="btn-start" class="btn-primary">
      <span class="btn-icon">▶</span>
      Iniciar Captura
    </button>

    <div id="progress-area" class="hidden">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-text" class="progress-text">Preparando...</p>
      <div id="stats" class="stats hidden">
        <span id="stat-sections">0 seções</span>
        <span id="stat-animations">0 animações</span>
        <span id="stat-frames">0 frames</span>
      </div>
    </div>

    <div id="done-area" class="hidden">
      <p class="done-text">✅ Captura concluída!</p>
      <p id="done-details" class="done-details"></p>
    </div>

    <div id="error-area" class="hidden">
      <p class="error-text" id="error-message"></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
